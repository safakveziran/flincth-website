<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Two windows or a saved workspace</title><desc id="desc">Concept illustration comparing separate browser windows with one three-pane workspace.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#edf3ff;font-size:30px} .small{fill:#a5b3ca;font-size:30px} .line{stroke:#273347;stroke-width:2} .pane{fill:#19253a;stroke:#80aaff;stroke-width:2}</style><rect width="760" height="360" rx="24" fill="#111b2b"/><text x="36" y="52">Two windows</text><text x="402" y="52">Saved workspace</text><rect class="pane" x="36" y="86" width="145" height="184" rx="12"/><rect class="pane" x="199" y="86" width="145" height="184" rx="12"/><rect x="402" y="86" width="322" height="184" rx="12" fill="#090e18" stroke="#80aaff" stroke-width="2"/><path d="M552 87V270M552 178H723" class="line"/><text class="small" x="36" y="320">Preset split ratio</text><text class="small" x="402" y="320">Sites + pane layout</text></svg>
