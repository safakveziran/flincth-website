<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Restore a saved display layout on demand</title><desc id="desc">Concept illustration of saving a layout, reconnecting the same displays and activating a setup.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#edf3ff;font-size:30px} .small{fill:#a5b3ca;font-size:30px} .line{stroke:#273347;stroke-width:2} .pane{fill:#19253a;stroke:#80aaff;stroke-width:2}</style><rect width="760" height="360" rx="24" fill="#111b2b"/><text x="36" y="54">1. Save</text><text x="280" y="54">2. Reconnect</text><text x="526" y="54">3. Activate</text><rect class="pane" x="36" y="100" width="196" height="144" rx="12"/><path d="M133 102V242" class="line"/><rect class="pane" x="280" y="100" width="196" height="144" rx="12"/><path d="M304 207L315 218L335 194" fill="none" stroke="#6ed8b2" stroke-width="3"/><rect class="pane" x="526" y="100" width="196" height="144" rx="12"/><path d="M623 102V242" class="line"/><text class="small" x="36" y="308">Your layout</text><text class="small" x="280" y="308">Same displays</text><text class="small" x="526" y="308">On demand</text></svg>
