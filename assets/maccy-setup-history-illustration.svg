<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Clipboard history by setup</title><desc id="desc">Concept illustration contrasting one searchable history with two separate setup text histories.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#edf3ff;font-size:30px} .small{fill:#a5b3ca;font-size:30px} .line{stroke:#273347;stroke-width:2} .pane{fill:#19253a;stroke:#80aaff;stroke-width:2}</style><rect width="760" height="360" rx="24" fill="#111b2b"/><text x="36" y="52">One history</text><text x="402" y="52">Per-setup text</text><rect class="pane" x="36" y="86" width="308" height="184" rx="12"/><path d="M60 128H316M60 174H316M60 220H252" stroke="#a5b3ca" stroke-width="5"/><rect class="pane" x="402" y="86" width="322" height="82" rx="12"/><text x="424" y="137">Writing</text><rect class="pane" x="402" y="188" width="322" height="82" rx="12"/><text x="424" y="239">Research</text><text class="small" x="36" y="320">Search across items</text><text class="small" x="402" y="320">Switch with your layout</text></svg>
