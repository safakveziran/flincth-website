    <path d="M78 52h112a18 18 0 0 1 18 18v128a18 18 0 0 1-18 18H78a18 18 0 0 1-18-18V112l-6-14 6-14V70a18 18 0 0 1 18-18z" fill="#0b4fc4"/>
  </g>
  <g transform="rotate(6 130 130)">
    <path d="M74 44h118a18 18 0 0 1 18 18v138a18 18 0 0 1-18 18H74a18 18 0 0 1-18-18v-74l-12-18 12-18V62a18 18 0 0 1 18-18z" fill="#0a84ff"/>
    <circle cx="76" cy="108" r="9" fill="#5fb0ff"/>
    <circle cx="76" cy="108" r="4" fill="#090e18"/>
    <text x="146" y="104" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.4">BLACK</text>
