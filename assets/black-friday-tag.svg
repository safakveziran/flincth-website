    <rect x="102" y="138" width="88" height="2" rx="1" fill="#ffffff" opacity=".45"/>
    <text x="146" y="188" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="41" font-weight="750" letter-spacing="-1.5">−60%</text>
  </g>
