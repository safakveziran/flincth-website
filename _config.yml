# Jekyll settings. GitHub Pages builds the site with these on every publish.
url: "https://flincth.com"
launch_email_endpoint: ""

# Search engine ownership checks. Paste the code each webmaster tool gives for
# its "meta tag" method; an empty value adds nothing. (Google Search Console is
# verified through DNS and needs nothing here. Bing was verified by importing
# the site from Google Search Console, so it needs no code; see README.md.)
verification:
  yandex: "3031ebd9388d7437"
  bing: ""

# Used by jekyll-feed for the blog feed (/blog/feed.xml).
title: Flincth
description: "Notes on building Flincth's apps for Mac, iPhone, iPad and the browser: small tools with a clear purpose."
author: Flincth

# Each page's language. Pages at the root are in the default language; add a
# block here for each new language folder and its pages take the language from it:
#
#   - scope: { path: "tr" }
#     values: { lang: tr }
defaults:
  - scope: { path: "" }
    values: { lang: en }
  # Blog posts live in _posts/ as YYYY-MM-DD-slug.md and are served at
  # /blog/<slug>, without ".html" like every other page. A post belongs to
  # Workspace Manager unless it sets another product: <id>
  # (_data/products.yml); the header and the closing card follow it.
  # product: none is a post about no product: brand header, no card.
  - scope: { path: "", type: posts }
    values: { layout: post, permalink: /blog/:title, product: workspace-manager }
  # Guides live in _guides/ (see the collection below). The Mac guides belong
  # to Workspace Manager, the iOS guides to Speed Reader; the browser guides
  # set product: split-view.
  - scope: { path: "", type: guides }
    values: { layout: guide }
  # Each folder sets its guides' platform (their list on /guides/), so a new
  # guide cannot drop out of its list by leaving it out.
  - scope: { path: "_guides/mac", type: guides }
    values: { platform: mac, product: workspace-manager }
  - scope: { path: "_guides/ios", type: guides }
    values: { platform: ios, product: speed-reader, og_image: /assets/og-reader.png, og_image_alt: og_image_alt_speed_reader }

# Step-by-step guides (see README.md, "Guides"): _guides/<platform>/<slug>.md
# is served at /guides/<platform>/<slug>.
collections:
  guides:
    output: true
    permalink: /guides/:path

# Development files that are not published.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - CLAUDE.md
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - tests
  - launch-email-worker

# Old light-theme version; kept in the repository but not published.
  - Flincth-Website

# Plugins that ship with GitHub Pages.
plugins:
  - jekyll-feed
  - jekyll-redirect-from
feed:
  path: blog/feed.xml
