# Jekyll settings. GitHub Pages builds the site with these on every publish.
url: "https://flincth.com"

# Each page's language. Pages at the root are in the default language; add a
# block here for each new language folder and its pages take the language from it:
#
#   - scope: { path: "tr" }
#     values: { lang: tr }
defaults:
  - scope: { path: "" }
    values: { lang: en }

# Development files that are not published.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - CLAUDE.md
  - README.md
  - PRODUCT.md
  - DESIGN.md

# Old light-theme version; kept in the repository but not published.
  - Flincth-Website

# jekyll-redirect-from ships with GitHub Pages. It lets a page list its old
# addresses in `redirect_from`; each one becomes a small page that sends
# visitors and search engines on to the new address (comparison pages that
# moved from /<name>-vs-flincth to /<name>-alternative).
plugins:
  - jekyll-redirect-from
