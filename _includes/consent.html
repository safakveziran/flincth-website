{%- capture policy_link %}<a href="{% include page-url.html ref="privacy" %}">{{ t.consent.policy }}</a>{% endcapture -%}
  <section class="consent" id="consent" role="region" aria-label="{{ t.consent.label }}" tabindex="-1" hidden>
    <div class="consent-inner">
      <p><b>{{ t.consent.title }}</b> {{ t.consent.text | replace: "[policy]", policy_link }}</p>
      <div class="consent-actions">
        <button type="button" id="consent-decline">{{ t.consent.decline }}</button>
        <button type="button" id="consent-accept">{{ t.consent.accept }}</button>
      </div>
    </div>
  </section>
