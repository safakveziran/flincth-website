{%- comment -%}
  JSON-LD for the brand's home page: the organization, the website and the
  list of products (_data/products.yml). Each product's own page carries
  its full SoftwareApplication entry under the same @id.
{%- endcomment -%}
{%- assign _t = site.data.i18n.en -%}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://flincth.com/#org",
        "name": "Flincth",
        "url": "https://flincth.com/",
        "logo": "https://flincth.com/assets/flincth-mark-512.png",
        "email": "support@flincth.com"
      },
      {
        "@type": "WebSite",
        "@id": "https://flincth.com/#website",
        "url": "https://flincth.com/",
        "name": "Flincth",
        "inLanguage": "en",
        "publisher": { "@id": "https://flincth.com/#org" }
      },
      {
        "@type": "ItemList",
        "@id": "https://flincth.com/#products",
        "name": "Flincth apps",
        "itemListElement": [
{%- for _p in site.data.products %}
  {%- capture _url %}{% include page-url.html ref=_p.id %}{% endcapture %}
  {%- if _p.browsers %}{% assign _anchor = "#extension" %}{% else %}{% assign _anchor = "#app" %}{% endif %}
          {
            "@type": "ListItem",
            "position": {{ forloop.index }},
            "item": {
              "@type": "SoftwareApplication",
              "@id": {{ site.url | append: _url | append: _anchor | jsonify }},
              "name": {{ _t.catalog[_p.id].name | jsonify }},
              "url": {{ site.url | append: _url | jsonify }},
              "description": {{ _t.catalog[_p.id].description | jsonify }},
              "applicationCategory": {% case _p.platform %}{% when "browser" %}"BrowserApplication"{% when "ios" %}"EducationalApplication"{% else %}"UtilitiesApplication"{% endcase %},
              "operatingSystem": {% case _p.platform %}{% when "browser" %}"Chrome, Firefox, Microsoft Edge"{% when "ios" %}"iOS 17 or later"{% else %}"macOS 14 or later"{% endcase %},
              "publisher": { "@id": "https://flincth.com/#org" }
            }
          }{% unless forloop.last %},{% endunless %}
{%- endfor %}
        ]
      }
    ]
  }
  </script>
