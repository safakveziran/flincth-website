# Questions every comparison page of a product shows after its own `faq`
# (mac: layout comparison, extension: extension-comparison, reader:
# reader-comparison). The layouts print them and put them, with the page's
# own questions, in the page's FAQPage JSON-LD (_includes/schema/comparison.html).
# Plain text only: no HTML, so the JSON-LD and the page say the same thing.
mac:
- q: Why does Flincth need a shortcut instead of Accessibility access?
  a: Flincth is sandboxed and never asks for Accessibility access. It moves windows through the “Flincth Apply” shortcut, which you install once in Apple Shortcuts. The app walks you through it.
- q: Can Flincth move windows between desktops?
  a: No. It places ordinary windows on the current desktop and does not move them between Mission Control desktops or into or out of full screen.
- q: Does Flincth snap windows when I drag them?
  a: No. Flincth applies your layout when you switch setups. It does not watch for drags or rearrange windows afterwards.
extension:
- q: Why does a site sometimes open as a window instead of a pane?
  a: Some sites refuse to be shown inside another page, and a site in a pane does not see your signed-in session. For those, Flincth opens a real browser window and keeps it lined up with the pane, so the site works exactly as it does in a normal tab.
- q: What does Flincth ask permission for?
  a: Nothing when you install it. Flincth then offers to enable all websites, so panes can show almost any site; you can choose Not now and still organize workspaces. Access is used only inside Flincth’s own tab and can be revoked in your browser’s extension settings.
- q: Does Flincth collect any data?
  a: No. Your workspaces are stored in your browser on your own device. Flincth has no account, no analytics and makes no network requests of its own.
reader:
- q: Can Flincth Speed Reader open Kindle or Apple Books purchases?
  a: No. Those books are protected with DRM, which the app cannot open. It reads DRM-free EPUB, PDF with a text layer, DOCX, TXT, RTF and Markdown, plus pasted text. Scanned PDFs without a text layer are not supported.
- q: What do I get without paying?
  a: Every reading mode and every format, light and dark themes, a dyslexia-friendly font and all accessibility settings. The free plan has a daily reading time, a few saved documents and a speed cap; Pro removes them with one purchase.
- q: Does the trial turn into a subscription?
  a: No. There is no subscription at all. The 7-day Pro trial is started by you, asks for no payment details and simply ends; Pro is a separate one-time purchase.
