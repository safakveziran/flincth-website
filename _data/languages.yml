# Languages the site is published in. The first one is the default: its pages
# live at the root (/privacy) and are marked hreflang="x-default". Other
# languages are published in their own folder (/tr/privacy).
#
#   code:   Folder name and the <html lang> / hreflang value (ISO 639-1)
#   name:   Name shown in the language switcher, written in that language
#   locale: og:locale value
#   dir:    Text direction; rtl for right-to-left languages
- code: en
  name: English
  locale: en_US
  dir: ltr
