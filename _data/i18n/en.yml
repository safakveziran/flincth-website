# Browser extension landing pages (/chrome, /firefox, /edge). The shared copy
# is in extension; each browser's own copy is in extension_<browser>. In any
# value, [browser] is replaced with that browser's name. Values that hold
# <span> are rendered as HTML.
extension:
  nav:
    features: Features
    how: How it works
    faq: FAQ
    cta: Notify me at launch
  hero_title: One tab. <span>Every site you need.</span>
  hero_copy: Flincth for [browser] splits a single tab into panes, puts a different site in each one, and saves the arrangement as a workspace. Switch workspaces with a click or a shortcut.
  hero_more: See how it works
  micro: No data collected · No account · No server
  preview:
    label: ONE TAB, ARRANGED YOUR WAY
    live: INTERACTIVE PREVIEW
    group: Preview a workspace
    status: "{name} workspace active"
    bottom: Three workspaces. One tab.
    hint: Choose a workspace above
    note: Illustrative preview, not a screenshot of the extension. Sites shown are placeholders.
    tab_title: Flincth
    embed: Embedded
    window: Attached window
    launcher: Launcher
    open: Open
    work: Work
    research: Research
    watch: Watch
    dashboard: Dashboard
    docs: Docs
    chat: Chat
    calendar: Calendar
    article: Article
    notes: Notes
    search: Search
    video: Video
    comments: Comments
  features_title: Every site in view. Every time.
  features_copy: Stop rebuilding the same four tabs side by side. Arrange them once, then switch.
  feature_split_title: Split the tab. Keep the proportions.
  feature_split_copy: Start from a layout or split any pane in two. Drag the dividers until each site has the room it needs; the proportions are saved when you let go.
  feature_modes_title: Some sites say no. Flincth has a plan B.
  feature_modes_copy: Each pane shows its site in whichever way that site allows.
  mode_embed: Inside the tab, for most sites
  mode_window: A real window lined up with the pane, signed in as usual
  mode_launcher: A card that opens the site in a normal tab
  feature_keys_title: Switch the whole view at once.
  feature_keys_copy: Click a workspace or press the shortcut you gave it. Layout and sites change together.
  feature_keys_hint: ⌘ ⇧ 1 on a Mac
  feature_alive_title: Leave mid-thought. Come back to it.
  feature_alive_copy: Recent workspaces stay loaded while you are away, so a half-typed reply or a paused video is still there when you switch back.
  privacy_title: Asks for nothing <span>it doesn’t need.</span>
  privacy_copy: No access to any site when you install it. [browser] asks for one site at a time, only when you put that site in a pane, and you can revoke it from the settings page. No analytics, no account, no server.
  privacy_caption: YOUR WORKSPACES STAY IN YOUR BROWSER.
  privacy_link: Read the privacy policy
  how_title: Arrange it once. Switch all day.
  how_copy: Three steps, and the arrangement is yours to keep.
  step1_title: Make a workspace.
  step1_copy: Open Flincth from the toolbar, name a workspace and pick a layout.
  step2_title: Add your sites.
  step2_copy: Type an address or pick one of your open tabs. [browser] asks permission for that one site.
  step3_title: Switch in a keystroke.
  step3_copy: Click a workspace, or press its shortcut. Everything you left open is where you left it.
  faq_title: Good questions.
  faq_mac_q: Is this the Flincth Mac app?
  faq_mac_a: No. The extension is a separate product that lives inside your browser. The Mac app arranges app windows across your displays; the extension arranges websites inside one tab. Each works without the other.
  faq_window_q: Why does a site open in a separate window?
  faq_window_a: Some sites refuse to be shown inside another page, and some keep you signed in with storage an embedded view cannot reach. For those, a pane can become a real browser window lined up with the pane, so the site behaves exactly as it does in a normal tab. Because it is a real window, it also appears in your window switcher and in screenshots.
  faq_permission_q: Why does it ask permission for each site?
  faq_permission_a: Flincth requests no site access when you install it. To show a site inside a pane it removes the one response header that blocks this, only for that site and only inside Flincth’s own tab. If you decline, the pane offers an attached window instead, which needs no permission at all.
  faq_data_q: Does Flincth see what I do on those sites?
  faq_data_a: No. It never reads cookies, never looks at page content and never adds code to a page. Your workspaces and the addresses in them are stored in [browser] on your own device, and the extension makes no network requests of its own.
  faq_keys_q: Where do I set keyboard shortcuts?
  others_title: Flincth, wherever you browse.
  closing_title: Make room in a single tab.
  closing_copy: Your browser, a little more arranged.
  icon_alt: Flincth extension icon
  og_image_alt: "Flincth for Chrome, Firefox and Edge: one tab, every site you need."

extension_chrome:
  title: "Flincth for Chrome: Split one tab into workspaces"
  description: "Flincth for Chrome splits one tab into panes with a site in each, saves the arrangement as a workspace and switches with a click or a shortcut."
  name: Chrome
  label: Flincth for Chrome
  status: Coming to the Chrome Web Store
  store_cta: Add to Chrome
  availability_q: When can I get it for Chrome?
  availability_a: Soon. The Chrome version is built and is being tested before it goes to the Chrome Web Store. This page will link to the listing once it is live.
  keys_a: Give each workspace its own shortcut when you create or edit it; those work while the Flincth tab is focused. Four more reach a workspace from anywhere in Chrome, even while you are typing in a pane. Choose which workspace each one opens in Flincth’s settings, and set their keys at chrome://extensions/shortcuts.

extension_firefox:
  title: "Flincth for Firefox: Split one tab into workspaces"
  description: "Flincth for Firefox, planned: split one tab into panes with a site in each, save it as a workspace and switch with a click or a shortcut."
  name: Firefox
  label: Flincth for Firefox
  status: Planned for Firefox Add-ons
  store_cta: Add to Firefox
  availability_q: Is there a Firefox version yet?
  availability_a: Not yet. A Firefox version is planned. Its privacy and permission design carries over from the Chrome version unchanged, and it will need Firefox 128 or later. This page will link to Firefox Add-ons when it is ready.
  keys_a: Give each workspace its own shortcut when you create or edit it; those work while the Flincth tab is focused. Four more reach a workspace from anywhere in Firefox, even while you are typing in a pane. Choose which workspace each one opens in Flincth’s settings, and set their keys under Manage Extension Shortcuts in about:addons.

extension_edge:
  title: "Flincth for Microsoft Edge: Split one tab into workspaces"
  description: "Flincth for Microsoft Edge, planned: split one tab into panes with a site in each, save it as a workspace and switch with a click or a shortcut."
  name: Edge
  label: Flincth for Microsoft Edge
  status: Planned for Microsoft Edge Add-ons
  store_cta: Get it for Edge
  availability_q: Is there an Edge version yet?
  availability_a: Not yet. Edge runs the same package as the Chrome version, so the Edge version is planned to follow it on Microsoft Edge Add-ons. This page will link to the listing when it is live.
  keys_a: Give each workspace its own shortcut when you create or edit it; those work while the Flincth tab is focused. Four more reach a workspace from anywhere in Edge, even while you are typing in a pane. Choose which workspace each one opens in Flincth’s settings, and set their keys at edge://extensions/shortcuts.
