# Copy for the shared parts (header, footer, cookie banner). For a new
# language, copy this file to <code>.yml and translate the values; leave the
# keys unchanged. A missing key renders as empty text. YAML reads on, off, yes
# and no as booleans, so never use them as key names.
skip: Skip to content
home_label: Flincth home

nav:
  label: Main navigation
  features: Features
  how: How it works
  faq: FAQ
  cta: Download for Mac
  # Links in the header on pages that belong to no single product (the home
  # page, the platform pages, privacy, support, guides, blog).
  guides: Guides
  blog: Blog
  support: Support
  # Header button on those pages; it opens the product list on the home page.
  all_products: All products

# Products menu in the header and the Products column in the footer. Product
# names and notes are in catalog; platform names are in platforms.
products:
  label: Products
  coming: Coming soon
  chrome: Chrome
  firefox: Firefox
  edge: Edge

# One entry per product in _data/products.yml, keyed by its id.
#   name:        Full name, used in headings, the menu and JSON-LD
#   short:       Name without "Flincth", for tight spaces
#   note:        A few words for the Products menu
#   category:    What it is, in the words people search for
#   description: One or two sentences for product cards
#   meta:        Small print under a product card; " · " separates items
#   cta:         Store button label (live products)
catalog:
  workspace-manager:
    name: Flincth Workspace Manager
    short: Workspace Manager
    note: Window layouts and clipboard history
    category: Window manager and clipboard manager for Mac
    description: Save a window layout and a clipboard history for each kind of work, then switch both from the menu bar in one step.
    meta: macOS 14 or later · One-time purchase · No account
    cta: Download on the Mac App Store
  speed-reader:
    name: Flincth Speed Reader
    short: Speed Reader
    note: Speed reading for your own documents
    category: Speed reading app for iPhone and iPad
    description: Read your own EPUB, PDF and DOCX files one word, phrase or short sentence at a time, at the pace you set.
    meta: iOS 17 or later · Free, one-time Pro upgrade · No account
  split-view:
    name: Flincth Split View
    short: Split View
    note: One tab, split into saved workspaces
    category: Split-screen tabs for Chrome, Firefox and Edge
    description: Split one browser tab into panes with a site in each, save the arrangement as a workspace, and switch with a click or a shortcut.
    meta: Free · Collects no data · No account
    cta: Choose your browser

# One entry per platform in _data/platforms.yml. The platform page itself
# (/<id>/, <id>/index.html) carries its title, heading and lead.
#   name:  Short name for the menu, the footer and product cards
#   all:   Link to the platform page from the home page
platforms:
  mac:
    name: Mac
    all: Mac apps
  ios:
    name: iPhone & iPad
    all: iPhone and iPad apps
  browser:
    name: Browser
    all: Browser extensions
  # Shown under a platform's products on its page.
  more: More apps for this platform are on the way.

# Product cards (_includes/product-card.html).
card:
  more: Learn more
  # Accessible name for the browser links on a browser extension's card.
  browsers: Choose a browser

# "Notify me at launch" buttons (notifications.js switches between the three).
notify:
  cta: Notify me at launch
  subscribed: You’ll hear at launch
  blocked: Notifications are blocked in this browser
  error: Couldn’t turn on notifications. Try again.
  # Header link shown instead of the button where the browser has no web push.
  fallback: Launch status
  # Topic-less version of the button, for news about every product.
  news: Tell me about new apps
  # Shown under the closing section on iPhone and iPad, where every browser
  # (Safari, Chrome and the rest all use WebKit) offers web push only to sites
  # opened from the Home Screen. That also needs manifest.webmanifest.
  ios_hint: "On iPhone or iPad, tap Share, then Add to Home Screen. Open Flincth from your Home Screen and the Notify me button will appear."

footer:
  help: Help
  legal: Legal
  privacy: Privacy
  support: Support
  guides: Guides
  blog: Blog
  cookies: Cookies
  note: Small apps. Clear purpose.
  languages: Language

notifications:
  default: Notifications
  subscribed: Notifications on
  blocked: Notifications blocked

consent:
  label: Cookie choice
  title: A quick choice about cookies.
  # [policy] is replaced with a link to the privacy policy.
  text: This website can use Google Analytics to count visits. It stores a cookie on your device and shares data with Google. Nothing loads unless you say yes, and your choice here has no effect on the Flincth apps. See the [policy].
  policy: privacy policy
  decline: Decline
  accept: Accept

# 404 page.
not_found:
  title: Page not found | Flincth
  description: That page does not exist on flincth.com.
  code: Error 404
  heading: This space is a little too empty.
  text: The page you were looking for doesn’t exist, or it moved somewhere tidier.
  back: Back to Flincth
  products: See all products

og_image_alt: "Flincth: small apps with a clear purpose, for Mac, iPhone, iPad and your browser."
og_image_alt_workspace_manager: "Flincth Workspace Manager: a place for every app. Space for every you."
og_image_alt_speed_reader: "Flincth Speed Reader for iPhone and iPad: read faster, still understand."

# Flincth Split View landing pages (/browser/split-view/chrome, /firefox, /edge). The shared copy
# is in extension; each browser's own copy is in extension_<browser>. In any
# value, [browser] is replaced with that browser's name. Values that hold
# <span> are rendered as HTML.
extension:
  nav:
    features: Features
    how: How it works
    faq: FAQ
    cta: Notify me at launch
  hero_title: One tab. <span>Every site you need.</span>
  hero_copy: Flincth Split View for [browser] splits a single tab into panes, puts a different site in each one, and saves the arrangement as a workspace. Switch workspaces with a click or a shortcut.
  hero_more: See how it works
  micro: No data collected · No account · No server
  preview:
    label: ONE TAB, ARRANGED YOUR WAY
    live: INTERACTIVE PREVIEW
    status: "{name} workspace active"
    bottom: Three workspaces. One tab.
    hint: Choose a workspace above
    note: Illustrative preview, not a screenshot of the extension. Sites shown are placeholders.
    tab_title: Flincth
    embed: Embedded
    window: Attached window
    launcher: Launcher
    open: Open
    work: Work
    research: Research
    watch: Watch
    dashboard: Dashboard
    docs: Docs
    chat: Chat
    calendar: Calendar
    article: Article
    notes: Notes
    search: Search
    video: Video
    comments: Comments
  features_title: Every site in view. Every time.
  features_copy: Stop rebuilding the same four tabs side by side. Arrange them once, then switch.
  feature_split_title: Up to eight sites in one tab.
  feature_split_copy: "[browser]’s built-in split view puts two tabs side by side. Flincth divides one tab into as many as eight panes: start from a layout or split any pane in two, then drag the dividers until each site has room. The proportions are saved when you let go."
  feature_modes_title: Some sites say no. Flincth has a plan B.
  feature_modes_copy: Each pane shows its site in whichever way that site allows.
  mode_embed: Inside the tab, for most sites
  mode_window: A real window lined up with the pane, signed in as usual
  mode_launcher: A card that opens the site in a normal tab
  feature_keys_title: Switch the whole view at once.
  feature_keys_copy: Click a workspace or press the shortcut you gave it. Layout and sites change together.
  feature_keys_hint: ⌘ ⇧ 1 on a Mac
  feature_alive_title: Leave mid-thought. Come back to it.
  feature_alive_copy: Recent workspaces stay loaded while you are away, so a half-typed reply or a paused video is still there when you switch back.
  privacy_title: Asks for nothing <span>it doesn’t need.</span>
  privacy_copy: No access to any site when you install it. [browser] asks for website access only when you choose to allow it, and you can revoke it in [browser]’s extension settings. No analytics, no account, no server.
  privacy_caption: YOUR WORKSPACES STAY IN YOUR BROWSER.
  privacy_link: Read the privacy policy
  how_title: Arrange it once. Switch all day.
  how_copy: Three steps, and the arrangement is yours to keep.
  step1_title: Make a workspace.
  step1_copy: Open Flincth from the toolbar, name a workspace and pick a layout.
  step2_title: Add your sites.
  step2_copy: Type an address or pick one of your open tabs. If Flincth doesn’t have website access yet, [browser] asks for it.
  step3_title: Switch in a keystroke.
  step3_copy: Click a workspace, or press its shortcut. Everything you left open is where you left it.
  faq_title: Good questions.
  faq_mac_q: Is this Flincth Workspace Manager?
  faq_mac_a: No. Split View lives inside your browser and arranges websites in one tab. Flincth Workspace Manager is a separate Mac app that arranges app windows across your displays. Each works without the other.
  faq_window_q: Why does a site open in a separate window?
  faq_window_a: Some sites refuse to be shown inside another page, and some keep you signed in with storage an embedded view cannot reach. For those, a pane can become a real browser window lined up with the pane, so the site behaves exactly as it does in a normal tab. Because it is a real window, it also appears in your window switcher and in screenshots.
  faq_permission_q: How does website access work?
  faq_permission_a: Installing Flincth gives it access to no website. [browser] asks for access only when you allow it, and you can revoke it in [browser]’s extension settings. Some sites still need a normal window.
  faq_data_q: Does Flincth see what I do on those sites?
  faq_data_a: It never reads cookies, page content or form data. Bundled code tracks each pane’s address and provides Back and Forward. Workspaces and their latest addresses are stored in [browser] on your own device; nothing is sent to Flincth.
  faq_keys_q: Where do I set keyboard shortcuts?
  others_title: Split View, wherever you browse.
  closing_title: Make room in a single tab.
  closing_copy: Your browser, a little more arranged.
  icon_alt: Flincth extension icon
  og_image_alt: "Flincth Split View for Chrome, Firefox and Edge: one tab, every site you need."

# The Split View overview (/browser/split-view/): a short hub that sends each
# visitor to their browser's page. Kept short and worded differently from the
# browser pages on purpose, so search engines do not treat them as duplicates.
# title, description, name, os and label also feed the page's JSON-LD.
extension_any:
  title: "Flincth Split View: Split Screen for Chrome, Firefox, Edge"
  description: "Flincth Split View splits one browser tab into panes with a site in each and switches saved workspaces. Free for Chrome, Firefox and Edge."
  name: your browser
  os: "Chrome, Firefox, Microsoft Edge"
  label: Flincth Split View
  hero_title: Split screen, <span>in a single tab.</span>
  hero_copy: A free extension that puts several websites side by side in one browser tab and remembers each arrangement as a workspace. Pick your browser to install it.
  pick_title: Pick your browser.
  pick_copy: It is the same extension everywhere. Website access and shortcuts differ a little between browsers, so each one has its own page with the details.
  details: "[browser] details"
  what_title: What it does.
  what_1_title: Several sites, one tab.
  what_1_copy: Divide a tab into as many as eight panes and give each its own address. Drag the dividers until every site has room.
  what_2_title: A plan B for stubborn sites.
  what_2_copy: A site that refuses to sit inside another page can open as a real window lined up with its pane, or as a card that opens a normal tab.
  what_3_title: Workspaces you switch.
  what_3_copy: Save each arrangement under a name and move between them with a click or a keyboard shortcut.
  privacy: No access to any website when you install it, no analytics and no account.
  privacy_link: How website access works
  guides_link: Step-by-step guides

extension_chrome:
  title: "Flincth Split View for Chrome: Split Screen in One Tab"
  description: "A split screen extension for Chrome: Flincth Split View puts up to eight sites in one tab, saves each layout as a workspace and switches in a click."
  name: Chrome
  label: Flincth Split View for Chrome
  status: Available on the Chrome Web Store
  store_cta: Add to Chrome
  availability_q: Where do I get it for Chrome?
  availability_a: From the Chrome Web Store, using the Add to Chrome button on this page. Installing it asks for no access to any site; right after installation Flincth offers to enable all websites, and you can skip that until you need it.
  privacy_copy: No access to any site when you install it. Flincth then offers to enable all websites; choose Not now and you can still organize workspaces, and Chrome asks again when you activate a site. Access is used only inside Flincth’s own tab and can be revoked in Chrome’s extension settings. No analytics, no account, no server.
  step2_copy: Type an address or pick one of your open tabs. If you skipped website access at install, Chrome asks for it now.
  faq_permission_a: Installing Flincth gives it access to no website. Right after installation it offers to enable all websites, so panes can show any site and follow redirects. You can choose Not now and still organize workspaces; activating a site asks again, and without access sites stay inactive. The access is used only inside Flincth’s own tab, where framing headers are removed so sites can display in panes. Revoke it any time in Chrome’s extension settings (chrome://extensions → Flincth → Details → Site access). Some sites still need a normal window for sign-in.
  keys_a: Give each workspace its own shortcut when you create or edit it; those work while the Flincth tab is focused. Four more reach a workspace from anywhere in Chrome, even while you are typing in a pane. Choose which workspace each one opens in Flincth’s settings, and set their keys at chrome://extensions/shortcuts.

extension_firefox:
  title: "Flincth Split View for Firefox: Split Screen in One Tab"
  description: "A split screen extension for Firefox: Flincth Split View puts up to eight sites in one tab, saves each layout as a workspace and switches in a click."
  name: Firefox
  label: Flincth Split View for Firefox
  status: Available on Firefox Add-ons
  store_cta: Add to Firefox
  availability_q: Where do I get it for Firefox?
  availability_a: From Firefox Add-ons, using the Add to Firefox button on this page. It needs Firefox 140 or later. Installing it asks for no access to any site; Firefox asks about one site at a time, when you put that site in a pane.
  privacy_copy: No access to any site when you install it. Firefox asks for one site at a time, only when you put that site in a pane, and you can revoke each one in Firefox’s add-on settings. No analytics, no account, no server.
  step2_copy: Type an address or pick one of your open tabs. Firefox asks permission for that one site.
  faq_permission_a: Installing Flincth gives it access to no website. The first time you put a site in a pane, Firefox asks about that one site. Firefox doesn’t let extensions change framing headers, so a site that refuses to be embedded stays blank in a pane; open it as a window instead. Revoke access any time in Add-ons and themes → Flincth → Permissions.
  keys_a: Give each workspace its own shortcut when you create or edit it; those work while the Flincth tab is focused. Four more reach a workspace from anywhere in Firefox, even while you are typing in a pane. Choose which workspace each one opens in Flincth’s settings, and set their keys under Manage Extension Shortcuts in about:addons.

extension_edge:
  title: "Flincth Split View for Edge: Split Screen in One Tab"
  description: "A split screen extension for Edge: Flincth Split View puts up to eight sites in one tab, saves each layout as a workspace and switches in a click."
  name: Edge
  label: Flincth Split View for Microsoft Edge
  status: Available on Microsoft Edge Add-ons
  store_cta: Add to Edge
  availability_q: Where do I get it for Edge?
  availability_a: From Microsoft Edge Add-ons, using the Add to Edge button on this page. Installing it asks for no access to any site; right after installation Flincth offers to enable all websites, and you can skip that until you need it.
  privacy_copy: No access to any site when you install it. Flincth then offers to enable all websites; choose Not now and you can still organize workspaces, and Edge asks again when you activate a site. Access is used only inside Flincth’s own tab and can be revoked in Edge’s extension settings. No analytics, no account, no server.
  step2_copy: Type an address or pick one of your open tabs. If you skipped website access at install, Edge asks for it now.
  faq_permission_a: Installing Flincth gives it access to no website. Right after installation it offers to enable all websites, so panes can show any site and follow redirects. You can choose Not now and still organize workspaces; activating a site asks again, and without access sites stay inactive. The access is used only inside Flincth’s own tab, where framing headers are removed so sites can display in panes. Revoke it any time in Edge’s extension settings (edge://extensions → Flincth → Details → Site access). Some sites still need a normal window for sign-in.
  keys_a: Give each workspace its own shortcut when you create or edit it; those work while the Flincth tab is focused. Four more reach a workspace from anywhere in Edge, even while you are typing in a pane. Choose which workspace each one opens in Flincth’s settings, and set their keys at edge://extensions/shortcuts.
