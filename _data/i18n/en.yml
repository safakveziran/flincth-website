  title: A quick choice about cookies.
  # [policy] is replaced with a link to the privacy policy.
  text: This website can use Google Analytics to count visits. It stores a cookie on your device and shares data with Google. Nothing loads unless you say yes, and the Flincth app itself still has no network access either way. See the [policy].
  policy: privacy policy
  decline: Decline
  accept: Accept

