# Browsers the Flincth extension has a landing page for, in display order.
# Each landing page's front matter sets browser: <id> and ref: <id>; its copy is
# in the extension_<id> section of _data/i18n/<lang>.yml.
#
#   id:        Page ref and the suffix of its i18n section
#   store_url: Store listing. Leave empty until the listing is live; the page
#              then shows the "coming" status and a Notify me button instead
#              of an install button. When you set it, also update that
#              browser's status and availability copy in _data/i18n/<lang>.yml.
- id: chrome
  store_url: "https://chromewebstore.google.com/detail/flincth/blkacdknkggnilgkmlmjemacfmnmdkhp"
- id: firefox
  store_url: "https://addons.mozilla.org/addon/flincth/"
- id: edge
  store_url: "https://microsoftedge.microsoft.com/addons/detail/jmokpipnbkgmbdnplegjklaaklcclaea"
